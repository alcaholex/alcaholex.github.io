name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: |
          echo "Building Next.js application..."
          npm run build
          echo "Build completed"

      - name: List build output
        run: |
          echo "Current directory contents:"
          ls -la
          echo "Looking for possible output directories:"
          find . -name "out" -type d 2>/dev/null || echo "No 'out' directory found"
          find . -name ".next" -type d 2>/dev/null || echo "No '.next' directory found"
          echo "Checking build directory contents:"
          if [ -d "out" ]; then
            echo "out directory exists:"
            ls -la out/
          elif [ -d ".next" ]; then
            echo ".next directory exists:"
            ls -la .next/
          else
            echo "Neither out nor .next directory found"
          fi

      - name: Create out directory if missing
        run: |
          if [ ! -d "out" ]; then
            echo "Creating out directory manually..."
            mkdir -p out
            if [ -d ".next" ]; then
              echo "Copying .next contents to out..."
              cp -r .next/* out/
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4