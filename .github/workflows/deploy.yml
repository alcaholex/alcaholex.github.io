name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Check Next.js config
        run: |
          echo "Checking Next.js config files:"
          ls -la next.config.*
          echo "Content of next.config.mjs:"
          cat next.config.mjs || echo "next.config.mjs not found"
          echo "Content of next.config.js (if exists):"
          cat next.config.js || echo "next.config.js not found"

      - name: Build with Next.js
        run: |
          echo "Building Next.js with static export..."
          npm run build
          echo "Build completed"

      - name: List build output
        run: |
          echo "Current directory contents:"
          ls -la
          echo "Contents of .next directory:"
          ls -la .next/ || echo ".next directory not found"
          echo "Checking for out directory:"
          if [ -d "out" ]; then
            echo "out directory exists:"
            ls -la out/
          else
            echo "out directory not found"
            echo "Creating out directory from .next/out if it exists..."
            if [ -d ".next/out" ]; then
              mv .next/out ./out
              echo "Moved .next/out to ./out"
              ls -la out/
            else
              echo "No static export found"
              exit 1
            fi
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4